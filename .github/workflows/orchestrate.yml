name: CI/CD Pipeline

# ─────────────────────────────────────────────────────────────────────
# Pipeline modes:
#   Push → *-dev             ➜  create PR to int-agentic (lightweight)
#   PR → int-agentic         ➜  full deploy + test MERGE COMMIT → auto-merge
#   PR → main                ➜  unit tests only (no Azure access)
#   PR from a fork           ➜  unit tests only (no Azure access)
#   Push → main              ➜  full deploy to production
#   Manual dispatch          ➜  full deploy (chosen environment)
#
# Promotion flow:
#   *-dev push → creates PR to int-agentic
#   PR to int-agentic → deploys MERGE COMMIT → tests → auto-merge if pass
#   int-agentic push → promote-to-main.yml → creates/updates PR to main
#   main PR → human review + unit tests → merge → full deploy to production
#
# Trust boundaries:
#   The `production` environment is only used from `main` (enforced by a
#   deployment branch policy on the environment). Pull requests never
#   target `production`, and PRs from forks never target any Azure
#   environment. Untrusted values (branch names, inputs) are passed to
#   scripts via `env:` and the resolved environment name is validated.
#
# Key design: PRs to int-agentic build from the GitHub merge commit,
# which combines the dev branch with int-agentic. This ensures we test
# the MERGED result, not the dev branch in isolation.
#
# Per-developer environments:
#   Each developer pushes to their own <name>-dev branch.
#   The pipeline maps <name>-dev → integration-<name> environment,
#   which contains that developer's own Azure subscription credentials.
# ─────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      target_env:
        type: string
        description: "Environment to deploy (e.g. integration-james, production)"
        required: true

  # ──────────────────────────────────────────────────────────────────────
  # Path filters: skip the expensive build+deploy+test pipeline for
  # changes that cannot affect the running application. Keep this list
  # conservative — when in doubt, run the pipeline.
  #
  # If you add new "documentation-only" file patterns (e.g. *.rst), add
  # them to BOTH the pull_request and push blocks to keep them in sync.
  # ──────────────────────────────────────────────────────────────────────
  pull_request:
    branches:
      - int-agentic
      - main
    paths-ignore:
      # Documentation & prose
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      # Sample env templates (never loaded at runtime)
      - '**/.env.sample'
      - '**/.env.example'
      # Repo / editor metadata
      - '**/.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.vscode/**'
      - '.idea/**'
      # GitHub metadata that doesn't affect app behavior
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/workflows/promote-to-main.yml'

  push:
    branches:
      - main
      - '*-dev'
    paths-ignore:
      # Documentation & prose
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      # Sample env templates (never loaded at runtime)
      - '**/.env.sample'
      - '**/.env.example'
      # Repo / editor metadata
      - '**/.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.vscode/**'
      - '.idea/**'
      # GitHub metadata that doesn't affect app behavior
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/workflows/promote-to-main.yml'

permissions:
  contents: write
  pull-requests: write
  id-token: write

# Prevent overlapping runs for the same PR/branch. Never cancel an in-flight
# run on `main` (cancelling a production deploy mid-apply is dangerous);
# cancel superseded runs on dev branches / PRs to save minutes and avoid
# concurrent Terraform state access on the same environment.
concurrency:
  group: cicd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


jobs:
  # ────────────────────────────────────────────────────────────────────
  # Step 0: Determine pipeline mode and target environment
  # ────────────────────────────────────────────────────────────────────
  pipeline-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.config.outputs.environment }}
      full_deploy: ${{ steps.config.outputs.full_deploy }}
      create_pr_only: ${{ steps.config.outputs.create_pr_only }}
    steps:
      - name: Determine pipeline mode
        id: config
        # Event-controlled values are passed via env (never interpolated into
        # the script) so branch names / inputs cannot inject shell commands.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          TARGET_ENV_INPUT: ${{ inputs.target_env }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          ENV=""
          FULL_DEPLOY="true"
          CREATE_PR_ONLY="false"

          # ── Resolve target environment and pipeline mode ──
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD_REPO" != "$REPO" ]; then
            # PRs from forks never get an Azure environment: unit tests only.
            FULL_DEPLOY="false"
          elif [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            # PRs to main: unit tests only. The int-agentic merge commit has
            # already been deployed and tested, and `production` is reserved
            # for the `main` branch.
            FULL_DEPLOY="false"
          elif [ "$EVENT" = "pull_request" ]; then
            case "$BASE_REF" in
              int-agentic)
                # PR to int-agentic: FULL deploy from merge commit to the
                # developer's environment (derived from the head branch)
                case "$HEAD_REF" in
                  *-dev)
                    ENV="integration-${HEAD_REF%-dev}" ;;
                  *)
                    ENV="integration" ;;
                esac ;;
              *)
                ENV="integration" ;;
            esac
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            ENV="$TARGET_ENV_INPUT"
          elif [ "$EVENT" = "push" ]; then
            case "$REF_NAME" in
              main)
                ENV="production" ;;
              *-dev)
                # Dev push: only create PR to int-agentic, no deploy
                ENV="integration-${REF_NAME%-dev}"
                CREATE_PR_ONLY="true"
                FULL_DEPLOY="false" ;;
              *)
                ENV="integration" ;;
            esac
          else
            ENV="integration"
          fi

          # ── Validate environment name before it is used downstream ──
          if [ "$FULL_DEPLOY" = "true" ] && [ -z "$ENV" ]; then
            echo "::error::No target environment resolved for a deploy run."
            exit 1
          fi
          if [ -n "$ENV" ] && ! [[ "$ENV" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid environment name derived from event context."
            exit 1
          fi

          {
            echo "environment=$ENV"
            echo "full_deploy=$FULL_DEPLOY"
            echo "create_pr_only=$CREATE_PR_ONLY"
          } >> "$GITHUB_OUTPUT"
          echo "──────────────────────────────────────"
          echo "Event:          $EVENT"
          echo "Environment:    $ENV"
          echo "Full deploy:    $FULL_DEPLOY"
          echo "Create PR only: $CREATE_PR_ONLY"
          echo "──────────────────────────────────────"

  # ────────────────────────────────────────────────────────────────────
  # Fast unit / regression tests (no Azure)
  #   Deterministic, mock-based tests that validate the agent-framework
  #   API surface used by every agent. A cheap, fast signal that catches
  #   breakage (e.g. a dependency upgrade) long before the expensive
  #   build/deploy path. Runs on PRs and pushes; skipped only for the
  #   lightweight *-dev "create PR" pass (the resulting PR re-runs them).
  # ────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit & Regression Tests (no Azure)
    needs: pipeline-config
    if: needs.pipeline-config.outputs.create_pr_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync application environment
        working-directory: agentic_ai/applications
        run: uv sync

      - name: Run agent-framework regression tests
        working-directory: agentic_ai/applications
        run: >-
          uv run --with pytest python -m pytest
          ../../tests/test_agent_framework_1_2_1_regression.py
          -v --junitxml=../../junit-unit.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: junit-unit.xml
          if-no-files-found: ignore
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────
  # Step 0.5: Create PR to int-agentic (*-dev push only)
  #   When a developer pushes to their *-dev branch, we just create
  #   (or update) a PR to int-agentic. The PR triggers the full pipeline
  #   which builds from the MERGE COMMIT, testing combined code.
  # ────────────────────────────────────────────────────────────────────
  create-pr:
    needs: pipeline-config
    if: needs.pipeline-config.outputs.create_pr_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create or update PR to int-agentic
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "🔍 Checking for existing PR: ${BRANCH} → int-agentic"

          EXISTING_PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base int-agentic \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "✅ PR #${EXISTING_PR} already exists — push updated it"
            echo "   The PR-triggered pipeline will run with the updated merge commit"
          else
            echo "📝 Creating PR: ${BRANCH} → int-agentic"
            gh pr create \
              --repo "${{ github.repository }}" \
              --base int-agentic \
              --head "$BRANCH" \
              --title "Merge ${BRANCH} into int-agentic" \
              --body "Auto-created by CI/CD pipeline.

          This PR will be automatically merged after the pipeline validates
          the **merge commit** (${BRANCH} + int-agentic combined).

          Pipeline run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "✅ PR created — full pipeline will trigger on the new PR"
          fi

  # ────────────────────────────────────────────────────────────────────
  # Step 1: Preflight – unlock Terraform state storage (full deploy only)
  # ────────────────────────────────────────────────────────────────────
  preflight:
    needs: pipeline-config
    if: needs.pipeline-config.outputs.full_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment: ${{ needs.pipeline-config.outputs.environment }}
    steps:
      - name: Azure OIDC Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: |
          echo "Preflight: ensuring Terraform state storage is accessible"
          if az group show --name "$TFSTATE_RG" > /dev/null 2>&1; then
            az storage account update --resource-group "$TFSTATE_RG" --name "$TFSTATE_ACCOUNT" --default-action Allow
            az storage account update --resource-group "$TFSTATE_RG" --name "$TFSTATE_ACCOUNT" --public-network-access Enabled
          else
            echo "::warning::Terraform state resource group '${TFSTATE_RG}' not found - skipping"
          fi
        env:
          TFSTATE_RG: ${{ vars.TFSTATE_RG }}
          TFSTATE_ACCOUNT: ${{ vars.TFSTATE_ACCOUNT }}

  # ────────────────────────────────────────────────────────────────────
  # Step 2: Deploy infrastructure (full deploy only)
  # ────────────────────────────────────────────────────────────────────
  deploy-infrastructure:
    needs: [pipeline-config, preflight]
    if: needs.pipeline-config.outputs.full_deploy == 'true'
    uses: ./.github/workflows/infrastructure.yml
    with:
      environment: ${{ needs.pipeline-config.outputs.environment }}
    secrets: inherit

  # ────────────────────────────────────────────────────────────────────
  # Step 3: Build containers (full deploy only)
  #   For PRs to int-agentic, actions/checkout gets the MERGE COMMIT
  #   so Docker images contain dev changes + int-agentic combined.
  # ────────────────────────────────────────────────────────────────────
  build-application-container:
    needs: [pipeline-config, deploy-infrastructure]
    if: needs.pipeline-config.outputs.full_deploy == 'true'
    uses: ./.github/workflows/docker-application.yml
    with:
      environment: ${{ needs.pipeline-config.outputs.environment }}
    secrets: inherit

  build-mcp-container:
    needs: [pipeline-config, deploy-infrastructure]
    if: needs.pipeline-config.outputs.full_deploy == 'true'
    uses: ./.github/workflows/docker-mcp.yml
    with:
      environment: ${{ needs.pipeline-config.outputs.environment }}
    secrets: inherit

  # ────────────────────────────────────────────────────────────────────
  # Step 4: Update Container Apps with new images (full deploy only)
  #   Uses SHA-tagged images to force new Container App revisions.
  # ────────────────────────────────────────────────────────────────────
  update-containers:
    needs: [pipeline-config, build-application-container, build-mcp-container]
    if: >-
      always()
      && needs.pipeline-config.outputs.full_deploy == 'true'
      && (needs.build-application-container.result == 'success' || needs.build-mcp-container.result == 'success')
    uses: ./.github/workflows/update-containers.yml
    with:
      environment: ${{ needs.pipeline-config.outputs.environment }}
      mcp_image_tag: ${{ github.sha }}
      backend_image_tag: ${{ github.sha }}
    secrets: inherit

  # ────────────────────────────────────────────────────────────────────
  # Step 5: Run integration tests (full deploy only)
  #   Always runs against the environment freshly deployed by this run.
  # ────────────────────────────────────────────────────────────────────
  integration-tests:
    needs: [pipeline-config, deploy-infrastructure, update-containers]
    if: >-
      always()
      && needs.pipeline-config.outputs.full_deploy == 'true'
      && needs.update-containers.result == 'success'
    uses: ./.github/workflows/integration-tests.yml
    with:
      environment: ${{ needs.pipeline-config.outputs.environment }}
      backend_endpoint: ${{ needs.deploy-infrastructure.outputs.backend_endpoint }}
      mcp_endpoint: ${{ needs.deploy-infrastructure.outputs.mcp_endpoint }}
      mcp_internal_only: true
    secrets: inherit

  # ────────────────────────────────────────────────────────────────────
  # Step 6: Agent quality evaluation (full deploy only)
  # ────────────────────────────────────────────────────────────────────
  agent-evaluation:
    needs: [pipeline-config, deploy-infrastructure, update-containers, integration-tests]
    if: >-
      always()
      && needs.pipeline-config.outputs.full_deploy == 'true'
      && needs.integration-tests.result == 'success'
    uses: ./.github/workflows/agent-evaluation.yml
    with:
      environment: ${{ needs.pipeline-config.outputs.environment }}
      backend_endpoint: ${{ needs.deploy-infrastructure.outputs.backend_endpoint }}
      eval_limit: 5
    secrets: inherit

  # ────────────────────────────────────────────────────────────────────
  # Step 7: Auto-merge PR into int-agentic
  #   After successful tests on the MERGE COMMIT, merge the PR.
  #   Uses GH_PAT so the push triggers promote-to-main.yml.
  # ────────────────────────────────────────────────────────────────────
  auto-merge:
    needs: [pipeline-config, integration-tests, agent-evaluation]
    if: >-
      always()
      && needs.pipeline-config.outputs.full_deploy == 'true'
      && needs.integration-tests.result == 'success'
      && (needs.agent-evaluation.result == 'success' || needs.agent-evaluation.result == 'skipped')
      && github.event_name == 'pull_request'
      && github.base_ref == 'int-agentic'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Auto-merge PR into int-agentic
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "✅ Tests passed on merge commit — auto-merging PR #${PR_NUMBER}"
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --squash \
            --auto \
            --subject "chore: merge ${HEAD_REF} into int-agentic (auto)" \
            --body "Auto-merged after successful CI/CD pipeline run ${RUN_ID}"
          echo "✅ PR #${PR_NUMBER} merge initiated"

  # ────────────────────────────────────────────────────────────────────
  # Step 8: Auto-destroy dev environment after successful merge
  #   Dev environments are ephemeral — tear down after merge.
  # ────────────────────────────────────────────────────────────────────
  auto-destroy:
    needs: [pipeline-config, auto-merge]
    if: >-
      always()
      && needs.auto-merge.result == 'success'
      && github.event_name == 'pull_request'
      && github.base_ref == 'int-agentic'
    uses: ./.github/workflows/destroy.yml
    with:
      environment: ${{ needs.pipeline-config.outputs.environment }}
    secrets: inherit
